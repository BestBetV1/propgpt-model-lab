name: Publish dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Test delivery checks
        run: python3 -m unittest discover -s tests -v
      - name: Validate the expected public release
        run: python3 ops/pages_delivery.py validate --site site
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Wait for the uploaded artifact in this run
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
        run: python3 ops/pages_delivery.py artifact
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the actual public release
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 ops/pages_delivery.py verify --site site
